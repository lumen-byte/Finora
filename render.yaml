databases:
  - name: finora-db
    databaseName: finora
    user: finora
    plan: free
    postgresMajorVersion: 15

services:
  - type: web
    name: finora-api
    env: docker
    plan: free
    region: ohio
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finora-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
